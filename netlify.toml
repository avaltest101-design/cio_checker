# Netlify configuration for LAVA COI AI Checker

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA fallback: every route resolves to index.html so the in-app
# navigation works on refresh / deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
